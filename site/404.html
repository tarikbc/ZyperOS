<!doctype html>
<!-- zyperos.com's page for an address that is not there. Cloudflare Pages
     serves it with a 404 for every unknown path, so it links back with
     absolute paths, and it stays out of search results. Beard and Salt &
     Pepper, like index.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | ZyperOS</title>
<meta name="description" content="That page is not on zyperos.com. ZyperOS is a fast custom firmware for the GKD Pixel 2.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap">
<style>
  :root { --ground: #e6e4da; --text: #1a1c1a; --text-soft: #3d403e; --accent: #bef23c; --on-accent: #111310; --edge: #c9c7bc; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #111310; --text: #e4e2d8; --text-soft: #c3c3ba; --edge: #3a3e3c; color-scheme: dark; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--text);
         font: 400 18px/1.6 Lexend, "Avenir Next", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; padding: 48px 24px; text-align: center; display: grid; gap: 18px; justify-items: center; }
  img { width: 140px; height: auto; }
  h1 { font-weight: 600; font-size: 40px; line-height: 1.1; margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--text-soft); }
  a.btn { display: inline-block; margin-top: 8px; padding: 12px 22px; border-radius: 14px; background: var(--accent); color: var(--on-accent);
          font-weight: 600; text-decoration: none; }
  a.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/img/zyper.svg" width="140" height="140" alt="">
  <h1>Zyper sniffed around, and this page is not here.</h1>
  <p>The address may have changed, or it never existed.</p>
  <a class="btn" href="/">Go to ZyperOS</a>
</main>
</body>
</html>
