# make check on every pull request and on main: the whole offline suite
# (Makefile CHECKS, Diatom's and the simulator's included) on macOS, the system
# ZyperOS is written on. A failure keeps build-native/check-logs as an artifact:
# one log a check, the failing one printed in the job's output as well.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    # A full make check takes 20 to 25 minutes on a quiet runner; on a busy
    # day (2026-11-19) runs went past 30 and were cancelled at the limit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: SDL2 for the host launcher and Diatom's desktop port, xz for CHD
        run: brew install sdl2 sdl2_image sdl2_ttf xz

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow for the image checks
        run: python -m pip install Pillow

      - name: make check
        run: make check

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: build-native/check-logs/

  # The same suite on Linux, beside the macOS job and not instead of it:
  # Linux runners are many more than macOS ones, and this is the start of
  # moving the suite there. Not trusted yet: the checks whose mk/checks file
  # adds them to CHECKS_LINUX_SKIP do not pass on Ubuntu (their first run,
  # 2026-11-18: PNGs the shader demo writes otherwise, the portal and the
  # play page in another Chrome, the shot checks' fonts, timing on four
  # cores, Diatom's desktop port), so make check-linux leaves them out and
  # they run on macOS only until each is fixed and taken off the list.
  check-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SDL2, SQLite, xz, ALSA, curl and OpenSSL for the host launcher, Diatom and the checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libsqlite3-dev liblzma-dev zlib1g-dev libasound2-dev libcurl4-openssl-dev libssl-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow for the image checks
        run: python -m pip install Pillow

      - name: make check-linux, the checks that pass on Linux
        run: make check-linux

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-linux
          path: build-native/check-logs/

  # The device files the macOS job never compiles: the launcher's for the
  # GKD Pixel 2 and the TrimUI Brick with their profiles, and Diatom's ports,
  # syntax only against Ubuntu's headers (make check-device-compile), so a
  # device nobody is holding still fails here when it stops building.
  devices:
    runs-on: ubuntu-24.04
    # The compile itself takes under a minute; apt-get alone took over ten
    # on some runners (2026-11-19), and the job was cancelled before it began
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Headers for SDL2, EGL, GLES, GBM, DRM, ALSA and SQLite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libegl-dev libgles-dev libgbm-dev libdrm-dev libasound2-dev libsqlite3-dev

      - name: make check-device-compile
        run: make check-device-compile
