<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZyperOS source art review</title><link rel="icon" href="data:,">
<style>
body{font:15px system-ui;margin:24px;background:#ecebe6;color:#272831}
h1{font-size:22px;font-weight:600}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
figure{margin:0;display:grid;justify-items:center;gap:8px}img{width:100%;height:220px;object-fit:contain;image-rendering:pixelated}
button{font:inherit;padding:8px 12px}body.dark{background:#191b22;color:#e9e9eb}
</style>
<header><h1>Original system art</h1><button id="theme">Dark background</button><p id="count"></p></header>
<main id="gallery"></main>
<script>
const query=new URLSearchParams(location.search),start=Number(query.get('start')||0),limit=Number(query.get('limit')||100);
fetch('source-index.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
 document.getElementById('count').textContent=`${data.length} source images`;
 for(const asset of data.slice(start,start+limit)){
  const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');
  img.src=asset.file;img.alt=asset.name;caption.textContent=asset.name;
  figure.append(img,caption);document.getElementById('gallery').append(figure);
 }
});
document.getElementById('theme').addEventListener('click',()=>{
 const dark=document.body.classList.toggle('dark');document.getElementById('theme').textContent=dark?'Light background':'Dark background';
});
</script>
</html>
