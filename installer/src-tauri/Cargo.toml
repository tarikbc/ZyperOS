[package]
name = "zyperos-installer"
version = "1.1.1-test.3"
description = "Puts ZyperOS on a microSD card for the GKD Pixel 2 or the TrimUI Brick, or updates one"
# Built on TortOS Installer by Eric Reinsmidt
authors = ["Tarik Caramanico", "Eric Reinsmidt"]
license-file = "../LICENSE"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The system's own file chooser, for a card image on this computer
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Both devices' images are .img.xz: a pure-Rust decoder, so nothing to link
# on three systems, and no encoder
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "xz"] }
# Downloads from GitHub: rustls with its own root certificates, so nothing
# to install alongside on Linux
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
# The Brick's closed files into its boot partition's FAT (closed.rs), in
# memory before the image is written: no card is mounted, on any system.
# Long names (alloc), no clock (a fixed date)
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
# The player's own PICO-8 zip (pico8.rs), read to check it and take its two
# files out: deflate only, through zlib-rs, so pure Rust and nothing to link
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The installer's own updates, on the systems where it replaces itself
# (selfupdate.rs): Tauri's updater checks, downloads and checks the signature.
# Linux's packages are the package manager's, so not there
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-updater = "2"
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# The tests make their own .xz images
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "xz", "encoder"] }
# selfupdate.rs's version rule, tested on every system
semver = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
