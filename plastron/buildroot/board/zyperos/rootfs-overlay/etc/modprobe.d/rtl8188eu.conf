# The RTL8188EU adapters (the TL-WN725N v2/v3 among them) go to Realtek's own
# driver, 8188eu (package rtl8188eu), not the kernel's rtl8xxxu: rtl8xxxu
# drives the 8188E as a client only, and ZyperOS's Wi-Fi File Transfer makes
# the adapter an access point when the handheld is on no network (hostapd).
# One driver for both, so nothing is swapped between them.
#
# usbrole loads drivers with busybox's modprobe by the device's alias; an
# alias here matches first, and modules.alias, where rtl8xxxu claims the same
# devices, is then not read. The list is 8188eu's own RTL8188E devices
# (its usb_intf.c). Every other adapter keeps rtl8xxxu.
#
# Busybox's modprobe has one quirk here: asked again for an alias whose
# module is already loaded (a later event for the same adapter, a replug),
# it reads modules.alias too and loads rtl8xxxu beside it. That costs its
# memory and nothing else: 8188eu registered first, so it keeps the adapter
# and is offered every replug before rtl8xxxu (seen on the Pixel 2,
# 2026-11-05: wlan0's driver is rtl8188eu with both loaded).
alias usb:v0BDAp8179* 8188eu
alias usb:v0BDAp0179* 8188eu
alias usb:v07B8p8179* 8188eu
alias usb:v0DF6p0076* 8188eu
alias usb:v2001p330F* 8188eu
alias usb:v2001p3310* 8188eu
alias usb:v2001p3311* 8188eu
alias usb:v2001p331B* 8188eu
alias usb:v056Ep4008* 8188eu
alias usb:v2357p010C* 8188eu
alias usb:v2357p0111* 8188eu
alias usb:v2C4Ep0102* 8188eu
alias usb:v0B05p18F0* 8188eu
alias usb:v7392pB811* 8188eu

# Its power saving off (rtw_power_mgnt=0: the radio never dozes between
# beacons while it is on a network; rtw_enusbss=0: no USB selective suspend).
# Realtek's 8188eu is known to drop off some routers over and over with it on,
# and a ZyperOS owner's TL-WN725N v3 left their home network every twenty
# seconds or so while the handheld's own network held (2026-11-13). The cost is
# the adapter's power while it is joined, a small part of the handheld's.
options 8188eu rtw_power_mgnt=0 rtw_enusbss=0
