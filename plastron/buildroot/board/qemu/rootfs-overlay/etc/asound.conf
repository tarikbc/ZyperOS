# Sound in QEMU's image: the Pixel 2's (board/px2/rootfs-overlay/etc/asound.conf),
# with the RK817's volume in software in front of the mix. QEMU's virtio sound
# card has no volume of its own; px2sim adds "Master Playback Volume" at boot
# with the codec's range (0-255, 0.375 dB a step), ZyperOS and Diatom write it
# as on the device, and this applies it. Keep the rest in step with the Pixel 2's.
pcm.!default {
	type plug
	slave.pcm "volume"
}

pcm.volume {
	type softvol
	slave.pcm "mixed"
	control {
		name "Master Playback Volume"
		card 0
	}
	min_dB -95.625
	max_dB 0.0
	resolution 256
}

pcm.mixed {
	type dmix
	ipc_key 1024
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		format S16_LE
		rate 48000
		channels 2
		period_size 512
		buffer_size 2048
	}
}

# A USB-C DAC, as on the Pixel 2: there is none in QEMU, so opening it fails
# and the program stays on the default, as it does on a Pixel 2 with none
pcm.usb {
	type plug
	slave.pcm "usbvolume"
}

pcm.usbvolume {
	type softvol
	slave.pcm "usbmixed"
	control {
		name "USB Playback Volume"
		card 0
	}
	min_dB -95.625
	max_dB 0.0
	resolution 256
}

pcm.usbmixed {
	type dmix
	ipc_key 1025
	ipc_perm 0666
	slave {
		pcm "hw:1,0"
		format S24_3LE
		rate 48000
		channels 2
		period_size 512
		buffer_size 2048
	}
}

ctl.!default {
	type hw
	card 0
}
