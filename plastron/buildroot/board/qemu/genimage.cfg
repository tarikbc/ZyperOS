# The card, laid out as the Pixel 2's (board/px2/genimage.cfg): a FAT boot
# partition at 16 MiB with each slot's kernel in /a and /b, boot.scr and
# bootstate.txt, then root A and root B, 512 MB each (root B moved to the
# fourth entry by post-image-slots.sh), so the games partition the first boot
# adds is the third, after root B, as on the device. No bootloader before
# it: QEMU starts U-Boot itself (out/qemu/u-boot.bin, scripts/
# build-qemu-uboot.sh), which runs boot.scr as the Pixel 2's does.
image boot.vfat {
	vfat {
		label = "PX2BOOT"
		file a/Image { image = "Image" }
		file boot.scr { image = "boot.scr" }
		file bootstate.txt { image = "bootstate.txt" }
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		fill = true
	}

	partition boot {
		partition-type = 0xC
		bootable = true
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 512M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 512M
	}
}
