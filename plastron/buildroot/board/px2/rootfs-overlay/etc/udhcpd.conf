# The computer on the other end of the USB cable, given the one address beside
# the Pixel's 10.42.0.1 (S40usbgadget). No router and no DNS: the link reaches
# the Pixel and nothing else, so a computer never sends its internet traffic
# this way. Leases go to /var/lib/misc, which is /tmp.
#
# A /30, not a /24 (2026-11-10): the link holds exactly two addresses, the
# Pixel's and the computer's, and the longest prefix wins the route on
# Windows, macOS and Linux alike, so another network the computer is on that
# also has 10.42.0.0/24 (NetworkManager's default for a shared connection, a
# VPN's, an office's) no longer ties with the cable for 10.42.0.1. A computer
# that reached some other 10.42.0.1 is what started this. The computer's side
# of the link has a fixed MAC address (S40usbgadget), so it is the same lease
# every plug.
interface usb0
start 10.42.0.2
end 10.42.0.2
max_leases 1
option subnet 255.255.255.252
option lease 86400
lease_file /var/lib/misc/udhcpd.leases
