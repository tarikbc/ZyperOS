# The card: the bootloader from sector 64 (Rockchip's DDR init and miniloader,
# our U-Boot and TF-A's BL31; see scripts/pack-bootloader.sh), then a FAT boot
# partition at 16 MiB (where Rockchip's layout leaves room for the
# bootloader), then the two system slots, root A and root B, 512 MB each:
# squashfs, read-only (ZyperOS's docs/updates.md, layer 2). 512 MB since
# 2026-11-06: the root with its ZyperOS payload (cores, ScummVM, J2ME) had
# outgrown 256 MB in LZ4, and the slot size is fixed when a card is laid out.
# post-image-slots.sh stops the build, before genimage, on a root that does
# not fit (size = below is what it reads). The boot
# partition holds each slot's kernel and device tree, in /a and /b, boot.scr
# (board/zyperos/boot-slots.cmd) and bootstate.txt, which says which slot
# boots. A new card has slot a; /b and root B stay empty until the first
# system update.
#
# genimage writes root B as the third partition and post-image-slots.sh moves
# it to the fourth entry, so the games partition the first boot adds stays
# partition 3, after root B. The image runs to the end of root B, zeros after
# the squashfs: the installer's update writes a whole system and refuses an
# image shorter than its partitions, a sign of a cut-short download.
image boot.vfat {
	vfat {
		label = "PX2BOOT"
		file a/Image { image = "Image" }
		file a/rk3326s-gkd-pixel2.dtb { image = "rk3326s-gkd-pixel2.dtb" }
		file boot.scr { image = "boot.scr" }
		file bootstate.txt { image = "bootstate.txt" }
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		fill = true
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-px2.bin"
		offset = 32K
	}

	partition boot {
		partition-type = 0xC
		bootable = true
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 512M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 512M
	}
}
