# The TrimUI Smart Pro's card, the Brick's (board/brick/genimage.cfg) with
# its own boot partition's label and device tree. What follows is the Brick's
# note, all of which holds for it. The TrimUI Brick's card: the boot loader 128 KiB in (where the A133's boot
# ROM looks when there's nothing at 8 KiB, which the GPT's own sectors keep
# clear), then the boot partition (FAT) at 4 MiB, root A, the state partition
# (ext4, 16 MB) for what has to last, and root B. GPT, as the Brick finds its
# state and games partitions by name: init.d/bluetooth mounts plastron-state,
# and the first boot adds the games partition, zyperos, after root B over the
# rest of the card, as partition 5. The roots are squashfs, read-only, 512 MB
# each, as the Pixel 2's (ZyperOS's docs/updates.md, layer 2), and at the
# Pixel 2's numbers, 2 and 4, so both boot through one bootstate script
# (board/zyperos/bootstate.cmd); rootswitch mounts the one boot.scr names
# (zyperos.root=). post-image-slots.sh stops the build, before genimage, on a
# root that does not fit plastron-root's size.
#
# The boot partition holds each slot's kernel (Image.lz4, which boot.scr
# boots, and Image, which U-Boot's own boot command falls back to), its
# initramfs and device tree in /a and /b, boot.scr and bootstate.txt, which
# says which slot boots. A new card has slot a; /b and root B stay empty until
# the first system update. The image runs to the end of root B, zeros after
# the squashfs: the installer refuses an image shorter than its partitions, a
# sign of a cut-short download.
image boot.vfat {
	vfat {
		label = "SMARTBOOT"
		file a/Image { image = "Image" }
		file a/Image.lz4 { image = "Image.lz4" }
		file a/smartpro.dtb { image = "smartpro.dtb" }
		file a/initramfs.cpio.gz { image = "initramfs.cpio.gz" }
		file boot.scr { image = "boot.scr" }
		file bootstate.txt { image = "bootstate.txt" }
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
		fill = true
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 128K
	}

	partition boot {
		partition-type-uuid = "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7"
		image = "boot.vfat"
		offset = 4M
	}

	partition plastron-root {
		partition-type-uuid = "L"
		image = "rootfs.squashfs"
		size = 512M
	}

	partition plastron-state {
		partition-type-uuid = "L"
		image = "state.ext4"
	}

	partition plastron-root-b {
		partition-type-uuid = "L"
		size = 512M
	}
}
