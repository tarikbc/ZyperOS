# The R36S's card: the GKD Pixel 2's (board/px2/genimage.cfg says why each
# part is where it is), with its own boot partition's label and device tree.
# Its bootloader is the Pixel 2's for now (board/r36s/post-image.sh), and
# the boot partition is where a tester puts a panel's overlay or another
# device tree (board/r36s/boot-prelude.cmd).
image boot.vfat {
	vfat {
		label = "R36SBOOT"
		file a/Image { image = "Image" }
		file a/rk3326-gameconsole-r36s-zyperos.dtb { image = "rk3326-gameconsole-r36s-zyperos.dtb" }
		file a/rk3326-gameconsole-r36s.dtb { image = "rk3326-gameconsole-r36s.dtb" }
		file boot.scr { image = "boot.scr" }
		file bootstate.txt { image = "bootstate.txt" }
		file r36s-boot.txt { image = "r36s-boot.txt" }
		file overlays/panel-0.dtbo { image = "panel-0.dtbo" }
		file overlays/panel-1.dtbo { image = "panel-1.dtbo" }
		file overlays/panel-2.dtbo { image = "panel-2.dtbo" }
		file overlays/panel-3.dtbo { image = "panel-3.dtbo" }
		file overlays/panel-4.dtbo { image = "panel-4.dtbo" }
		file overlays/panel-4v22.dtbo { image = "panel-4v22.dtbo" }
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		fill = true
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-px2.bin"
		offset = 32K
	}

	partition boot {
		partition-type = 0xC
		bootable = true
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 512M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 512M
	}
}
