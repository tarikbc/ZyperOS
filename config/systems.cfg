# Ports come last and are not a console, so no release date places them. A
# port is a program with a script of its own, PortMaster's layout: the .sh at
# the top of Roms/Ports, its files in a folder beside it. The core is not a
# core - "port" tells the launcher to hand the script to launch.sh rather than
# to Diatom (launch_port in src/main.c). Pixel 2 only for now: the Brick's
# launch.sh has no handoff, and an empty folder keeps the shelf hidden there.
sys|Ports|Ports|port|PRT|PORTS.png|FF6FAE|sh

# How much clock a system's games get, by tag: power|tag|light or medium.
# A system with no line runs at full, the device's top clocks, and so does
# every port and standalone emulator. The ceilings are the Pixel 2's
# (Diatom's port/pixel2.c): light is the CPU at up to 816 MHz, the memory at
# 328 and the GPU at up to 200; medium the CPU at up to 1008 and the GPU at
# up to 300, the memory at full. A lower clock is a lower voltage, which is
# the battery saved, and under the ceiling the governors still clock down.
#
# ZyperOS is for performance first: a ceiling is only for a system whose
# heaviest game keeps its speed under it, with no frame dropped, and Diatom
# lifts it for the rest of a game at the first frame that comes late, a
# stall or a dropped sound. So a wrong line costs a moment's battery, not a
# game's speed. The Brick ignores these.
#
# Measured on a Pixel 2, 2026-11-04, each system's heaviest games on the test
# card for 30 s under their ceiling, as the share of a frame's time the core
# took: light, Pitfall II 38%, Kirby's Adventure 45%, Super Mario Bros. 3 42%,
# Kirby's Dream Land 2 30%, 007 (GBC) 50%, the rest 18-35%; medium, Star Fox
# 81%, Stunt Race FX 54%, Donkey Kong Country 56%, Vectorman 52%, Sonic CD
# 55%, Golden Sun 50%, Doom II 32%, Metal Slug (NGPC) 63%, all with no late
# frame. Virtua Racing (its SVP chip) and Donkey Kong Country on the GBA went
# to full at their first late frame, as meant. The Neo Geo Pocket has no
# line: its core took 87% at medium (Baseball Stars) and 87% at light, where
# it went up after a late frame, so it is the memory it waits on, and too
# close to the edge.
power|A2600|light
power|GW|light
power|NES|light
power|A7800|light
power|SMS|light
power|GB|light
power|GG|light
power|GBC|light
power|NGPC|medium
power|MD|medium
power|PCE|medium
power|SFC|medium
power|SEGACD|medium
power|GBA|medium

# The pad, where a system's core reads it its own way: map|tag|spec, a Diatom
# button map in SETMAP's form (from:to, the button pressed and the one the
# core sees), sent after RUN and joined with the system's turbo; and
# controller|tag|n, the libretro controller type the core gets for port 0,
# sent with RUN. A system with neither gets the pad as it is, the plain
# joypad. Diatom only: a standalone emulator ("run:") has its own mapping.
#
# flycast2021 lays the Dreamcast pad out by position, the RetroPad's south
# button as the Dreamcast's A, and the Pixel 2's caps are Nintendo's, A on
# the right and B at the bottom. So the B cap was the Dreamcast's A, and the
# X cap its Y. I played the Dreamcast on ROGUE OS with each cap the button
# it names, and its triggers on L1 and R1, where the core reads them from L2
# and R2 (its pad has no other shoulder buttons); so the faces swap, and so
# do each side's two shoulders. NAOMI and Atomiswave run on the same core:
# their faces swap the same way, putting button 1 on the A cap, but their L1
# and R1 are already buttons of their own (5 and 6 on NAOMI, 5 on R1 on
# Atomiswave), so the shoulders stay. ROGUE's own files gave the
# position layout; its player remaps are on a partition macOS will not let
# be read, so this follows what I reported, 2026-11-05.
map|DC|a:b,b:a,x:y,y:x,l1:l2,l2:l1,r1:r2,r2:r1
map|NAOMI|a:b,b:a,x:y,y:x
map|AW|a:b,b:a,x:y,y:x
#
# YabaSanshiro lays the Saturn pad out by position too, the RetroPad's south
# button as the Saturn's A and its west one as X, so its faces swap as the
# Dreamcast's do and each cap is the button it names. C and Z are on L1 and
# R1, the Saturn's own L and R on L2 and R2.
map|SATURN|a:b,b:a,x:y,y:x
#
# FreeJ2ME-Plus lays a phone's keypad on the pad with the OK key (Fire) on
# the RetroPad's Y and the 9 key on its A. The phone's most used key goes on
# the A cap: the two swap.
map|J2ME|a:y,y:a
#
# Mupen64Plus-Next turns the face buttons into the N64's C buttons while the
# RetroPad's R2 is held (its "C Buttons Mode", when the core's independent
# C-button option is off, as it is here). The N64 has no SELECT, so SELECT
# holds that R2 and the R2 key does nothing: SELECT+X/A/B/Y are C up, right,
# down and left, and R2 is free beside the hotkeys SELECT's shoulders are
# (SELECT+R1/L1 save and load, SELECT+R2/L2 the speed). R2+X/A/B/Y until
# 2026-11-07. Diatom judges SELECT before the map, so a face button pressed
# under it gives the core its R2 on the same frame (diatom/src/chord.h).
map|N64|select:r2,r2:none
#
# stick|tag|dpad: the d-pad is the core's left analog stick, sent with RUN
# as stick=dpad (Diatom's src/stick.h). The N64 pad has a stick and a D-pad,
# and its games move with the stick: Super Mario 64 and Mario Kart 64 take
# the D-pad in a menu at most, so on the Pixel 2, which has no stick, the
# d-pad did nothing in play (2026-11-08). Full deflection, a diagonal as far
# out as a straight push. SELECT held, then the d-pad, is the N64's own
# D-pad until SELECT is let go; a direction held before SELECT, or pressed
# after a C button under the same SELECT, stays the stick, so the camera
# turns without the run stopping. RetroArch's analog_dpad_mode "left analog"
# is the same idea, and ROCKNIX and Knulli set it for the N64.
#
# Only the N64. The Dreamcast's games take the d-pad and the stick both, and
# its fighting and 2D games want the d-pad; the Saturn's standard pad is all
# d-pad (only a few games know the 3D pad); the PlayStation has its own
# analog toggle (controller|PS1 below).
stick|N64|dpad
#
# The PlayStation rumbles through the DualShock only: pcsx_rearmed's plain pad
# has no motor. 517 is its DualShock, RETRO_DEVICE_SUBCLASS(RETRO_DEVICE_ANALOG,
# 1), which is ROGUE OS's setting too. It starts in digital mode, so a game
# plays as on the plain pad, and its sticks read centered; the DualShock's
# analog toggle combo goes on L3+R3 (src/db.c), which the Pixel 2 does not have.
controller|PS1|517
