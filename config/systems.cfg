# Its games are FinalBurn Neo ROM sets like the Arcade shelf's, on the same
# core: one core on two shelves, as the Pockets are, because people file the
# Neo Geo as a console and libretro keeps its covers apart. Every set needs
# neogeo.zip, the BIOS set, in Bios/ (FBNeo also looks beside the game); it is
# not the disc bios field, which is checked for discs only.
