# had none (2026-11-06). It runs some games, and not at full speed: with
# its stand-in BIOS forced for a measure, Flicky's Flock ran at 37 fps of 60,
# 25.7 ms a frame, on its default polygon mode, the fastest of the three
# (perspective_correction; cpu_tesselation 36 fps, gpu_tesselation 23 fps).
# No .m3u: the core changes no discs.
sys|Saturn|Saturn|yabasanshiro|SATURN|SATURN.png|5B6AA8|cue,chd,iso,ccd,mds|saturn_bios.bin,sega_101.bin,mpr-17933.bin

