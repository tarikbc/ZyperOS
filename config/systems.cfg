# ScummVM, the point-and-click adventures' engines, is software with no
# hardware of its own, so it sorts on its first release, 0.0.1 in October
# 2001. Its libretro core, built from ScummVM's own tree without OpenGL
# (mk/build-scummvm.sh), runs in Diatom. A game is a FOLDER of the
# original's files, shown as one game named after the folder: launched by a
# .scummvm file inside it, which holds the game's ScummVM ID (sky for Beneath
# a Steel Sky, queen for Flight of the Amazon Queen), or, without one, by the
# folder's first file, from which the core detects the game itself
# (src/library.c). The engines' data files and the GUI's theme ship in
# ZyperOS/scummvm, which launch.sh puts in Bios/scummvm, where the core
# looks. It has no save states: a game saves from its own menu, or from
# ScummVM's, on START (src/db.c has the buttons).
sys|ScummVM|ScummVM|scummvm|SCUMMVM|SCUMMVM.png|00C832|scummvm

