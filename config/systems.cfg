# The four small systems came from ROGUE OS on the GKD Pixel 2, on 2026-11-03,
# each on the core ROGUE ran it with, so a library that played there plays
# here: stella for the 2600 (Stella 2014 here, the light fork: 3.0 MB against
# mainline's 7.3 and a third of its writable data, and every game the move was
# for runs on it), prosystem for the 7800, gw for Game & Watch, and FinalBurn
# Neo for the arcade folder - ROGUE's arcade.core=fbneo, and its nvram and
# high scores sit in fbneo/ beside the sets. Game & Watch is .mgw only: the
# folder also holds .srm files, which are saves, not games.
#
# The 7800 runs without a BIOS. ProSystem looks for "7800 BIOS (U).rom" in
# Bios/ and, when it is there, boots through it: the Atari logo first, then the
# game. Klax ran to its title both ways in a container on 2026-11-03.
#
# Arcade is not a console and has no release date to sort on, so it comes
# after them all, ahead of Ports. Its games are ROM SETS, not ROMs: ssf2.zip
# is 23 chips, its name is the game's name, and FinalBurn Neo finds and checks
# each chip by CRC. That is why the shelf reads "ssf2" (the file name is the
# only title it has) and why a set is never renamed or unpacked. A set from a
# different FinalBurn Neo or MAME release may be missing a chip; the core says
# which, in the log. .7z sets work as well as .zip ones.
sys|Arcade|Arcade|fbneo|ARCADE|ARCADE.png|8E5BD8|zip,7z

