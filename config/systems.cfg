# Sega CD and 32X run on PicoDrive, as ROGUE OS ran the 32X (its Sega CD was
# on genesis_plus_gx) and as plorpOS runs both. Genesis stays on
# genesis_plus_gx: PicoDrive would do it in a third of the CPU time (0.09
# against 0.32 ms a frame for Sonic 2 in a linux/arm64 container), but
# genesis_plus_gx already holds full speed on the Pixel 2 and reached 3.94x
# at 4x fast forward (782ec32), and a move would orphan every Genesis save
# state on the card. One core for the two add-ons rather than two: in the
# same container the Sega CD on genesis_plus_gx cost 0.39 to 0.45 ms a frame
# against PicoDrive's 0.25 to 0.38, and the 32X has only PicoDrive.
#
# The Sega CD shelf takes discs only, so its disc bios is checked for every
# game. bios_CD_U.bin is the US BIOS; PicoDrive picks bios_CD_E.bin or
# bios_CD_J.bin by the disc's region and a European or Japanese disc wants
# that one in Bios/ too. .bin is left off, as on the PlayStation's: it is the
# track file a .cue names. Saves are one 8 KB backup RAM per disc in Saves/,
# named after the disc; genesis_plus_gx's shared scd_U.brm is the same 8 KB,
# which is how tools/from-rogue.sh carries ROGUE's over.
sys|Sega CD|Sega CD|picodrive|SEGACD|SEGACD.png|2FA6B8|chd,cue,iso,m3u|bios_CD_U.bin

