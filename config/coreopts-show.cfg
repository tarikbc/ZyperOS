# Which core options the Core Settings page shows.
#
#   core=<libretro short name>     # bluemsx, gambatte, ...
#   key=<option key>               # under that core
#
# An absent file, a core with no key= lines, or a core not named here shows
# every option the core (or its cache / seed) offers. Uncomment to restrict:
#
# core=bluemsx
# key=bluemsx_cartmapper
# key=bluemsx_additional_cart
