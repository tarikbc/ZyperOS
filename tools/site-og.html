<!doctype html>
<!-- The social card for zyperos.com (og:image, 1200 x 630): the lockup, the
     page's title line and the Spotlight home, on Beard's ground with
     DESIGN.md's type and corners. tools/site-art.sh draws it to site/og.png
     with headless Chrome; open it in a browser to look at it first. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #e6e4da; color: #1a1c1a;
    font-family: Lexend, "Avenir Next", system-ui, sans-serif;
    display: grid; grid-template-columns: 560px 1fr; align-items: center;
    -webkit-font-smoothing: antialiased;
  }
  .text { padding: 0 0 0 72px; display: grid; gap: 26px; }
  .lockup { width: 360px; height: auto; display: block; }
  h1 { font-weight: 600; font-size: 50px; line-height: 1.08; margin: 0; letter-spacing: -.01em; }
  p { font-size: 25px; line-height: 1.4; margin: 0; color: #3d403e; }
  .url { font-size: 22px; color: #476b00; font-weight: 600; }
  .shot {
    width: 576px; height: 432px; border-radius: 28px; overflow: hidden;
    box-shadow: 0 18px 48px rgb(17 19 16 / .22); justify-self: center;
  }
  .shot img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="text">
    <img class="lockup" src="../res/readme/lockup-light.png" alt="">
    <h1>Fast custom firmware for the GKD Pixel 2</h1>
    <p>Forty systems, PortMaster ports, box art and RetroAchievements, from a card you can take out.</p>
    <span class="url">zyperos.com</span>
  </div>
  <div class="shot"><img src="../res/readme/systems.png" alt=""></div>
</body>
</html>
