# Zyper, the ZyperOS Discord bot (src/index.js). Deploy: npx wrangler deploy
# The bot token is a secret: npx wrangler secret put DISCORD_TOKEN
name = "zyper-bot"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

